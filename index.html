<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090f0b">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>오늘의 환율</title>
<meta name="description" content="달러·엔·원·위안·유로 오늘 환율을 한 화면에서">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 한 화면 세로 리스트: 상단 기준 금액 입력, 아래 다섯 통화 행. 행을 누르면 그 통화가 기준이 된다. */
:root {
  /* Pavilion TCG 색감: 짙은 녹흑 배경 + 네온 그린 포인트 (다크 단일 테마) */
  --bg: #090f0b;
  --surface: #131a16;
  --surface-2: #1b241f;
  --fg: #f3f6f3;
  --muted: #929b96;
  --line: rgba(255,255,255,.1);
  --accent: #39fc72;
  --accent-dim: #0ea053;
  --on-accent: #07150a;
  --accent-soft: rgba(57,252,114,.08);
  --font: "Pretendard", "Inter", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --num: "Space Grotesk", "Pretendard", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100%;
  padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
.stamp { font-size: 0.78rem; color: var(--muted); text-align: right; }
.stamp.err { color: #e5484d; }
.brand { display: flex; align-items: center; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.brand img { height: 26px; width: auto; display: block; }

.base {
  background: var(--surface);
  border: 1px solid var(--accent-dim);
  border-radius: 16px;
  padding: 14px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
}
.base label { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.02em; }
.base-row { display: flex; align-items: center; gap: 10px; }
.base-row img { width: 36px; height: 24px; border-radius: 3px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px var(--line); }
.base-sym { font: 700 1.8rem/1 var(--num); color: var(--muted); flex: none; }
#amount {
  flex: 1; min-width: 0;
  font: 700 2.2rem/1.1 var(--num);
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--surface-2);
  padding: 2px 0;
  outline: none;
}
#amount:focus { border-bottom-color: var(--accent); }
.base-words { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }

/* 기준 통화 선택: 작은 버튼 줄 */
.picker { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.picker button {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font: 600 0.72rem/1 "JetBrains Mono", ui-monospace, monospace;
  letter-spacing: .03em;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 7px 0 6px;
  min-width: 0;
  white-space: nowrap;
  cursor: pointer;
}
.picker img { width: 24px; height: 16px; border-radius: 2px; object-fit: cover; }
.picker button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); }
.picker button:focus-visible, .picker button:hover { border-color: var(--accent-dim); }

ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
li {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  column-gap: 12px;
  row-gap: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
}
.flag { width: 44px; height: 30px; border-radius: 4px; object-fit: cover; box-shadow: 0 0 0 1px var(--line); }
.name { display: grid; gap: 2px; min-width: 0; }
.name b { font-size: 1rem; font-weight: 700; }
.name small { font-size: 0.74rem; color: var(--muted); font-family: "JetBrains Mono", ui-monospace, monospace; letter-spacing: .04em; }
.val { text-align: right; display: grid; gap: 2px; min-width: 0; }
.val strong { font-family: var(--num); font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; word-break: break-all; }
.val span { font-size: 0.74rem; color: var(--muted); }
.val .u { font-size: .75em; font-weight: 600; color: var(--muted); margin-right: 2px; }
.words { grid-column: 2 / 4; font-size: 0.8rem; color: var(--muted); }
footer { font-size: 0.72rem; color: var(--muted); text-align: center; margin-top: auto; }
@media (max-height: 640px) {
  li { padding: 8px 12px; }
  .val strong { font-size: 1.15rem; }
}
</style>
</head>
<body>
<div class="app">
  <div class="brand"><img src="pavilion-wordmark.png" alt="Pavilion" width="400" height="91"></div>
  <header>
    <h1>오늘의 환율</h1>
    <div class="stamp" id="stamp">환율 불러오는 중…</div>
  </header>

  <section class="base" aria-label="기준 금액">
    <label for="amount" id="baseLabel">기준 금액</label>
    <div class="base-row">
      <img id="baseFlag" alt="">
      <span class="base-sym" id="baseSym"></span>
      <input id="amount" inputmode="decimal" autocomplete="off" value="1" size="1">
    </div>
    <div class="base-words" id="baseWords"></div>
  </section>

  <div class="picker" id="picker" role="group" aria-label="기준 통화 선택"></div>

  <ul id="list"></ul>

  <footer>매일 자동 갱신 · 참고용 기준 환율</footer>
</div>

<script>
const CURRENCIES = [
  { code: "USD", sym: "$", name: "미국 달러", unit: "달러", flag: "us", per: 1 },
  { code: "JPY", sym: "¥", name: "일본 엔", unit: "엔", flag: "jp", per: 100 },
  { code: "KRW", sym: "₩", name: "대한민국 원", unit: "원", flag: "kr", per: 1 },
  { code: "CNY", sym: "元", name: "중국 위안", unit: "위안", flag: "cn", per: 1 },
  { code: "EUR", sym: "€", name: "유럽 유로", unit: "유로", flag: "eu", per: 1 },
];
const flagUrl = c => `https://flagcdn.com/w160/${c}.png`;

let rates = null;          // 1 USD 기준 각 통화 값
let base = "USD";
try { base = localStorage.getItem("fx-base") || "USD"; } catch (e) {}

const $ = id => document.getElementById(id);
const list = $("list");

// 한글 금액 읽기: 1384500 -> "백삼십팔만 사천오백"
const DIG = ["", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
const SMALL = ["", "십", "백", "천"];
const BIG = ["", "만", "억", "조", "경"];
function chunkWords(n) {
  let s = "";
  const d = String(n).padStart(4, "0").split("").map(Number);
  for (let i = 0; i < 4; i++) {
    const v = d[i], pos = 3 - i;
    if (!v) continue;
    s += (v === 1 && pos > 0 ? "" : DIG[v]) + SMALL[pos];
  }
  return s;
}
function koreanWords(num) {
  let n = Math.round(num);
  if (!isFinite(n)) return "";
  if (n === 0) return "영";
  const parts = [];
  let i = 0;
  while (n > 0 && i < BIG.length) {
    const c = n % 10000;
    if (c) parts.unshift((c === 1 && i === 1 ? "" : chunkWords(c)) + BIG[i]);
    n = Math.floor(n / 10000);
    i++;
  }
  return parts.join(" ");
}
function decimals(code, v) {
  if (code === "KRW" || code === "JPY") return Math.abs(v) >= 100 ? 0 : 2;
  return Math.abs(v) >= 1000 ? 0 : 2;
}
const fmt = (code, v) => v.toLocaleString("ko-KR", { minimumFractionDigits: decimals(code, v), maximumFractionDigits: decimals(code, v) });
const parseAmount = () => {
  const v = parseFloat($("amount").value.replace(/[^0-9.]/g, ""));
  return isFinite(v) ? v : 0;
};
const convert = (amt, from, to) => amt / rates[from] * rates[to];

function renderPicker() {
  const picker = $("picker");
  picker.innerHTML = "";
  for (const c of CURRENCIES) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-pressed", c.code === base);
    btn.setAttribute("aria-label", `${c.name} 기준`);
    btn.innerHTML = `<img src="${flagUrl(c.flag)}" alt="">${c.sym} ${c.code}`;
    btn.addEventListener("click", () => {
      if (c.code === base) return;
      base = c.code;
      try { localStorage.setItem("fx-base", base); } catch (e) {}
      renderPicker();
      render();
    });
    picker.appendChild(btn);
  }
}

function render() {
  const b = CURRENCIES.find(c => c.code === base);
  $("baseFlag").src = flagUrl(b.flag);
  $("baseSym").textContent = b.sym;
  $("baseLabel").textContent = `기준 금액 · ${b.name}`;
  const amt = parseAmount();
  $("baseWords").textContent = amt ? koreanWords(amt) : "";

  list.innerHTML = "";
  for (const c of CURRENCIES) {
    if (c.code === base) continue;
    const li = document.createElement("li");
    let value = "—", sub = "", words = "";
    if (rates) {
      const v = convert(amt, base, c.code);
      value = fmt(c.code, v);
      words = v >= 1 ? `${Math.abs(v - Math.round(v)) > 0.005 ? "약 " : ""}${koreanWords(v)}` : "";
      sub = c.code === "KRW"
        ? `${b.sym}${b.per} = ₩${fmt("KRW", convert(b.per, b.code, "KRW"))}`
        : `${c.sym}${c.per} = ₩${fmt("KRW", convert(c.per, c.code, "KRW"))}`;
    }
    li.innerHTML = `
      <img class="flag" src="${flagUrl(c.flag)}" alt="${c.name} 국기">
      <span class="name"><b>${c.name}</b><small>${c.code}</small></span>
      <span class="val"><strong><small class="u">${c.sym}</small>${value}</strong><span>${sub}</span></span>
      ${words ? `<span class="words">${words}</span>` : ""}`;
    list.appendChild(li);
  }
}

$("amount").addEventListener("input", render);
$("amount").addEventListener("focus", e => e.target.select());

// 환율 소스: 매일 갱신되는 무료 API. 하나가 실패하면 다음으로.
const SOURCES = [
  async () => {
    const r = await fetch("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json", { cache: "no-cache" });
    const d = await r.json();
    return { date: d.date, r: { USD: 1, KRW: d.usd.krw, JPY: d.usd.jpy, CNY: d.usd.cny, EUR: d.usd.eur } };
  },
  async () => {
    const r = await fetch("https://latest.currency-api.pages.dev/v1/currencies/usd.json", { cache: "no-cache" });
    const d = await r.json();
    return { date: d.date, r: { USD: 1, KRW: d.usd.krw, JPY: d.usd.jpy, CNY: d.usd.cny, EUR: d.usd.eur } };
  },
  async () => {
    const r = await fetch("https://open.er-api.com/v6/latest/USD", { cache: "no-cache" });
    const d = await r.json();
    const date = new Date(d.time_last_update_unix * 1000).toISOString().slice(0, 10);
    return { date, r: { USD: 1, KRW: d.rates.KRW, JPY: d.rates.JPY, CNY: d.rates.CNY, EUR: d.rates.EUR } };
  },
];

async function load() {
  for (const src of SOURCES) {
    try {
      const { date, r } = await src();
      if (Object.values(r).every(v => typeof v === "number" && v > 0)) {
        rates = r;
        const [y, m, d] = date.split("-");
        $("stamp").textContent = `${y}.${m}.${d} 기준`;
        $("stamp").classList.remove("err");
        try { localStorage.setItem("fx-cache", JSON.stringify({ date, r })); } catch (e) {}
        render();
        return;
      }
    } catch (e) { /* 다음 소스 시도 */ }
  }
  // 모두 실패: 마지막으로 받은 값 사용
  try {
    const c = JSON.parse(localStorage.getItem("fx-cache"));
    if (c) { rates = c.r; $("stamp").textContent = `${c.date} 저장된 환율 (인터넷 확인)`; render(); return; }
  } catch (e) {}
  $("stamp").textContent = "환율을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.";
  $("stamp").classList.add("err");
}

renderPicker();
render();
load();
</script>
</body>
</html>
